---
- name: Apply personal dotfiles
  hosts: localhost
  gather_facts: true
  vars:
    vscode_repo_keyring: /etc/apt/keyrings/packages.microsoft.gpg
    chrome_repo_keyring: /etc/apt/keyrings/google-linux.gpg
    apt_dev_packages:
      - build-essential
      - pkg-config
      - cmake
      - ninja-build
      - gdb
      - clang
      - lldb
      - make
      - git
      - gh
      - curl
      - wget
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - ripgrep
      - fd-find
      - fzf
      - jq
      - yq
      - bat
      - eza
      - tree
      - unzip
      - zip
      - xz-utils
      - tmux
      - zsh
      - neovim
      - shellcheck
      - shfmt
      - htop
      - deluge
      - docker.io
      - docker-compose-v2
      - python3
      - python3-pip
      - python3-venv
      - pipx
      - golang-go
      - code
      - google-chrome-stable
      - adb
      - fastboot
      - openjdk-17-jdk
    dotfiles_files:
      - .zshrc
      - .zprofile
      - .zshenv
      - .gitconfig
      - .inputrc
      - .vimrc
      - .clang-format
    dotfiles_dirs:
      - .config/fish
      - .config/nvim
      - .config/zellij
      - .config/btop
      - .config/fastfetch
      - .config/gh

  tasks:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      become: true
      when: ansible_os_family == "Debian"

    - name: Download Microsoft apt signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/packages.microsoft.asc
        mode: "0644"
      become: true
      when: ansible_os_family == "Debian"

    - name: Convert Microsoft apt key to gpg format
      ansible.builtin.command:
        cmd: gpg --dearmor --yes --output {{ vscode_repo_keyring }} /etc/apt/keyrings/packages.microsoft.asc
      become: true
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Add VS Code apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by={{ vscode_repo_keyring }}] https://packages.microsoft.com/repos/code stable main"
        filename: vscode
        state: present
      become: true
      when: ansible_os_family == "Debian"

    - name: Download Google Linux apt signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-linux.pub
        mode: "0644"
      become: true
      when: ansible_os_family == "Debian"

    - name: Convert Google apt key to gpg format
      ansible.builtin.command:
        cmd: gpg --dearmor --yes --output {{ chrome_repo_keyring }} /etc/apt/keyrings/google-linux.pub
      become: true
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Add Google Chrome apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by={{ chrome_repo_keyring }}] https://dl.google.com/linux/chrome/deb/ stable main"
        filename: google-chrome
        state: present
      become: true
      when: ansible_os_family == "Debian"

    - name: Install developer packages with apt
      ansible.builtin.apt:
        name: "{{ apt_dev_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 86400
      become: true
      when: ansible_os_family == "Debian"

    - name: Fetch latest Obsidian release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
        return_content: true
        headers:
          User-Agent: Ansible
          Accept: application/vnd.github+json
      register: obsidian_release
      when:
        - ansible_os_family == "Debian"
        - ansible_architecture in ["x86_64", "amd64"]

    - name: Resolve latest Obsidian amd64 deb URL
      ansible.builtin.set_fact:
        obsidian_deb_url: >-
          {{
            obsidian_release.json.assets
            | selectattr('name', 'search', '_amd64[.]deb$')
            | map(attribute='browser_download_url')
            | list
            | first | default('')
          }}
      when:
        - ansible_os_family == "Debian"
        - ansible_architecture in ["x86_64", "amd64"]

    - name: Ensure latest Obsidian deb URL was found
      ansible.builtin.assert:
        that:
          - obsidian_deb_url is defined
          - obsidian_deb_url | length > 0
      when:
        - ansible_os_family == "Debian"
        - ansible_architecture in ["x86_64", "amd64"]

    - name: Download Obsidian deb package
      ansible.builtin.get_url:
        url: "{{ obsidian_deb_url }}"
        dest: /tmp/obsidian_amd64.deb
        mode: "0644"
      when:
        - ansible_os_family == "Debian"
        - ansible_architecture in ["x86_64", "amd64"]

    - name: Install Obsidian from official deb release
      ansible.builtin.apt:
        deb: /tmp/obsidian_amd64.deb
        state: present
      become: true
      when:
        - ansible_os_family == "Debian"
        - ansible_architecture in ["x86_64", "amd64"]

    - name: Ensure parent directories for file dotfiles exist
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_files }}"

    - name: Ensure parent directories for directory dotfiles exist
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_dirs }}"

    - name: Copy file dotfiles to home
      ansible.builtin.copy:
        src: "home/{{ item }}"
        dest: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ dotfiles_files }}"

    - name: Copy directory dotfiles to home
      ansible.builtin.copy:
        src: "home/{{ item }}"
        dest: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ dotfiles_dirs }}"
