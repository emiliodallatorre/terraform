---
- name: Apply personal dotfiles
  hosts: localhost
  gather_facts: true
  vars:
    apt_dev_packages:
      - build-essential
      - pkg-config
      - cmake
      - ninja-build
      - gdb
      - clang
      - lldb
      - make
      - git
      - curl
      - wget
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - ripgrep
      - fd-find
      - fzf
      - jq
      - yq
      - bat
      - eza
      - tree
      - unzip
      - zip
      - xz-utils
      - tmux
      - zsh
      - neovim
      - docker.io
      - docker-compose-v2
      - python3
      - python3-pip
      - python3-venv
      - pipx
      - golang-go
      - adb
      - fastboot
      - openjdk-17-jdk
    dotfiles_files:
      - .zshrc
      - .zprofile
      - .zshenv
      - .gitconfig
      - .inputrc
      - .vimrc
      - .clang-format
    dotfiles_dirs:
      - .config/fish
      - .config/nvim
      - .config/zellij
      - .config/btop
      - .config/fastfetch
      - .config/gh

  tasks:
    - name: Install developer packages with apt
      ansible.builtin.apt:
        name: "{{ apt_dev_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 86400
      become: true
      when: ansible_os_family == "Debian"

    - name: Ensure parent directories for file dotfiles exist
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_files }}"

    - name: Ensure parent directories for directory dotfiles exist
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_dirs }}"

    - name: Copy file dotfiles to home
      ansible.builtin.copy:
        src: "home/{{ item }}"
        dest: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ dotfiles_files }}"

    - name: Copy directory dotfiles to home
      ansible.builtin.copy:
        src: "home/{{ item }}"
        dest: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ dotfiles_dirs }}"
